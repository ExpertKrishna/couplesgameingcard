<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couples Connection Deck</title>
    
    <meta name="theme-color" content="#2b0813">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; transition: background 0.5s ease, color 0.3s ease, border-color 0.5s ease; }
        
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; position: relative; overflow-x: hidden; user-select: none;
        }

        body.lvl-all, body.lvl-1 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); }
        body.lvl-2 { background: linear-gradient(135deg, #4a0e17 0%, #800f2f 60%, #c9184a 100%); }
        body.lvl-3 { background: linear-gradient(135deg, #2b0813 0%, #590d22 50%, #a4133c 100%); }
        body.lvl-4 { background: linear-gradient(135deg, #0f051d 0%, #290628 50%, #6b0504 100%); }

        .heart-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }

        .float-item {
            position: absolute; bottom: -50px; font-size: 24px;
            animation: floatUp 6s infinite linear; opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(25deg); opacity: 0; }
        }

        .app-container {
            z-index: 1; width: 100%; max-width: 400px;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 { font-size: 26px; margin: 0 0 4px 0; text-align: center; text-shadow: 0 3px 12px rgba(0,0,0,0.4); }
        p.subtitle { font-size: 13px; margin-bottom: 12px; opacity: 0.95; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }

        .top-controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }

        .lang-wrapper {
            background: rgba(0, 0, 0, 0.4); padding: 6px 14px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25); display: flex; align-items: center; gap: 6px;
            backdrop-filter: blur(6px);
        }

        select.lang-select {
            background: transparent; color: #fff; border: none;
            font-size: 12px; font-weight: bold; outline: none; cursor: pointer;
        }
        select.lang-select option { background: #2b0813; color: #fff; }

        .rules-btn {
            background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4);
            color: white; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: bold; cursor: pointer; backdrop-filter: blur(6px);
        }

        .btn-container { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }

        .filter-btn {
            padding: 8px 14px; border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px; background: rgba(0, 0, 0, 0.3); color: #fff;
            cursor: pointer; font-weight: 600; font-size: 11px;
            backdrop-filter: blur(5px); transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #fff; color: #2b0813; font-weight: bold; border-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35); transform: translateY(-2px);
        }

        .card-perspective { perspective: 1000px; width: 100%; height: 260px; }

        .card {
            width: 100%; height: 100%; border-radius: 24px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 28px; text-align: center; font-size: 18px; font-weight: 600; line-height: 1.55;
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), background 0.4s ease, border 0.4s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .card.flipping { transform: rotateY(180deg) scale(0.95); }

        .card.lvl-all, .card.lvl-1 { background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%); color: #2d3436; border: 3px solid #ffb6c1; }
        .card.lvl-2 { background: linear-gradient(135deg, #fff5f7 0%, #ffe3e8 100%); color: #590d22; border: 3px solid #ff4d6d; }
        .card.lvl-3 { background: linear-gradient(135deg, #3a001e 0%, #1a000e 100%); color: #ffccd5; border: 3px solid #ff4d6d; }
        .card.lvl-4 { background: linear-gradient(135deg, #140005 0%, #2b000a 100%); color: #ff4d6d; border: 3px solid #ff003c; box-shadow: 0 0 25px rgba(255, 0, 60, 0.6); text-shadow: 0 0 8px rgba(255, 77, 109, 0.5); }

        .card-level-tag {
            position: absolute; top: 14px; right: 16px;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.2px; padding: 4px 10px; border-radius: 12px;
            background: rgba(0, 0, 0, 0.08); color: inherit;
        }

        .card-counter { position: absolute; bottom: 12px; font-size: 11px; opacity: 0.6; font-weight: bold; }

        .draw-btn {
            margin-top: 25px; padding: 16px 36px; font-size: 16px; font-weight: bold; color: white;
            border: none; border-radius: 35px; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .draw-btn.lvl-all, .draw-btn.lvl-1 { background: linear-gradient(45deg, #ff758c, #ff7eb3); }
        .draw-btn.lvl-2 { background: linear-gradient(45deg, #c9184a, #ff4d6d); }
        .draw-btn.lvl-3 { background: linear-gradient(45deg, #590d22, #a4133c); }
        .draw-btn.lvl-4 { background: linear-gradient(45deg, #ff003c, #900c3f); box-shadow: 0 0 20px rgba(255, 0, 60, 0.7); }
        .draw-btn:active { transform: scale(0.93); }

        .kiss-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 90px; z-index: 999; pointer-events: none; opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .kiss-overlay.active { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
            padding: 20px; backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1a000e; border: 2px solid #ff4d6d; border-radius: 20px; padding: 25px;
            max-width: 380px; width: 100%; color: #fff; position: relative; max-height: 85vh; overflow-y: auto;
        }

        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 20px; cursor: pointer; color: #ff4d6d; }
        .modal h2 { margin-top: 0; color: #ff4d6d; font-size: 20px; }
        .modal h3 { font-size: 15px; color: #ffccd5; margin-bottom: 5px; }
        .modal p { font-size: 13px; line-height: 1.5; opacity: 0.9; margin-bottom: 12px; }
    </style>
</head>
<body class="lvl-all">

    <div class="heart-bg" id="heartBg"></div>
    <div class="kiss-overlay" id="kissOverlay">👩‍❤️‍💋‍👨</div>

    <div class="app-container">
        <h1>Couples Deck ❤️</h1>
        <p class="subtitle">Select mood & draw a card</p>

        <div class="top-controls">
            <div class="lang-wrapper">
                <label>🌐</label>
                <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="hinglish">Hinglish</option>
                    <option value="hindi">हिंदी (Hindi)</option>
                    <option value="english">English</option>
                </select>
            </div>
            <button class="rules-btn" onclick="toggleModal(true)">How to Play 📖</button>
        </div>

        <div class="btn-container">
            <button class="filter-btn active" onclick="filterLevel('All', this)">All Cards</button>
            <button class="filter-btn" onclick="filterLevel('Level 1', this)">Ice Breakers 👏</button>
            <button class="filter-btn" onclick="filterLevel('Level 2', this)">Deep Romance 💖</button>
            <button class="filter-btn" onclick="filterLevel('Level 3', this)">Bold Desires 💋</button>
            <button class="filter-btn" onclick="filterLevel('Level 4', this)">Wild Midnight 🔥</button>
        </div>

        <div class="card-perspective">
            <div class="card lvl-all" id="cardBox">
                <span class="card-level-tag" id="cardTag">READY</span>
                <div id="cardText">Button dabayein aur pehla card nikalein! 🎲</div>
                <div class="card-counter" id="cardCounter">Card 0 / 0</div>
            </div>
        </div>

        <button class="draw-btn lvl-all" id="drawBtn" onclick="drawCardWithEffect()">
            <span id="btnIcon">❤️</span>
            <span id="btnText">Shuffle & Draw Card</span>
        </button>
    </div>

    <!-- Modal -->
    <div class="modal" id="rulesModal">
        <div class="modal-content">
            <span class="modal-close" onclick="toggleModal(false)">✖</span>
            <h2 id="modalTitle">How to Play 📖</h2>
            <h3 id="hInPerson">👩‍❤️‍👨 In-Person Mode:</h3>
            <p id="ruleInPerson"></p>
            <h3 id="hLongDist">📱 Long Distance Mode:</h3>
            <p id="ruleLongDistance"></p>
            <h3 id="hGameRule">🔥 Game Rule:</h3>
            <p id="ruleGeneral"></p>
        </div>
    </div>

    <script>
        const heartContainer = document.getElementById('heartBg');
        const levelIcons = {
            'lvl-all': ['❤️', '💖', '👏', '💌', '🌹', '💋'],
            'lvl-1': ['👏', '😊', '🌹', '❤️', '🎈', '✨'],
            'lvl-2': ['💌', '🕯️', '👩‍❤️‍👨', '💖', '💕', '🌹'],
            'lvl-3': ['💋', '🔥', '👄', '🌶️', '💗', '💄'],
            'lvl-4': ['🔥', '💋', '😈', '👩‍❤️‍💋‍👨', '🔞', '🌶️']
        };

        function updateFloatingIcons(levelClass) {
            try {
                heartContainer.innerHTML = '';
                const icons = levelIcons[levelClass] || levelIcons['lvl-all'];
                for(let i = 0; i < 20; i++) {
                    let item = document.createElement('div');
                    item.className = 'float-item';
                    item.innerText = icons[Math.floor(Math.random() * icons.length)];
                    item.style.left = Math.random() * 100 + 'vw';
                    item.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    item.style.animationDelay = Math.random() * 5 + 's';
                    heartContainer.appendChild(item);
                }
            } catch(e) { console.warn("Floating icons error:", e); }
        }

        updateFloatingIcons('lvl-all');

        // Safe Audio Player
        function playPopSound() {
            try {
                let AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                let ctx = new AudioCtx();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) { console.warn("Audio not supported or blocked:", e); }
        }

        const rulesText = {
            hinglish: {
                title: "How to Play 📖",
                inPerson: "Ek partner button dabakar card nikale aur doosre partner se sawal pooche. Doosra partner poori sachai aur pyaar se jawab dega.",
                longDist: "WhatsApp Video Call par is app ko kholein. Ek-ek karke card shuffle karein aur apne partner se sawal poochein.",
                gen: "Koi bhi sawal skip nahi kiya ja sakta! Agar koi jawab dene se mana kare, toh use partner ki ek romantic wish poori karni hogi!"
            },
            hindi: {
                title: "कैसे खेलें 📖",
                inPerson: "एक पार्टनर बटन दबाकर कार्ड निकालेगा और कार्ड पर लिखा सवाल दूसरे पार्टनर से पूछेगा। दूसरा पार्टनर पूरी सच्चाई और प्यार से जवाब देगा।",
                longDist: "WhatsApp वीडियो कॉल पर इस ऐप को खोलें। एक-एक करके कार्ड शफ़ल करें और अपने पार्टनर से सवाल पूछें।",
                gen: "कोई भी सवाल स्किप नहीं किया जा सकता! अगर कोई जवाब देने से मना करता है, तो उसे पार्टनर की एक विश पूरी करनी होगी!"
            },
            english: {
                title: "How to Play 📖",
                inPerson: "One partner draws a card and asks the question. The other partner answers honestly and lovingly.",
                longDist: "Open the app during a video call. Take turns shuffling cards and ask each other intimate questions.",
                gen: "No skipping allowed! If someone refuses to answer, they must fulfill a romantic wish for their partner!"
            }
        };

        const cards = [
            { cat: "Level 1", label: "Ice Breakers 👏", hinglish: "Jab hum pehli baar mile the, toh tumne mujhme sabse pehli cheez kya notice ki thi?", hindi: "जब हम पहली बार मिले थे, तो तुमने मुझमें सबसे पहली चीज़ क्या नोटिस की थी?", english: "When we first met, what was the very first thing you noticed about me?" },
            { cat: "Level 2", label: "Deep Romance 💖", hinglish: "Mere saath tumhari perfect romantic date night kaisi honi chahiye?", hindi: "मेरे साथ तुम्हारी परफेक्ट रोमांटिक डेट नाइट कैसी होनी चाहिए?", english: "What does your idea of a perfect romantic date night with me look like?" },
            { cat: "Level 3", label: "Bold Desires 💋", hinglish: "Bedroom me mera aisa kaun sa touch hai jo tumhara mood turant turn on kar deta hai?", hindi: "बेडरूम में मेरा ऐसा कौन सा टच है जो तुम्हारा मूड तुरंत ऑन कर देता है?", english: "Which touch of mine in the bedroom instantly turns you on?" },
            { cat: "Level 4", label: "Wild Midnight 🔥", hinglish: "Aisi kaun si wild secret fantasy hai jo tumne aaj tak mujhe khulkar nahi batayi?", hindi: "ऐसी कौन सी वाइल्ड सीक्रेट फैंटेसी है जो तुमने आज तक मुझे खुलकर नहीं बताई?", english: "What is a wild secret fantasy you've never shared with me openly?" }
        ];

        let currentCategory = "All";
        let currentLang = "hinglish";
        let currentLevelClass = "lvl-all";

        function changeLanguage(lang) {
            currentLang = lang;
            updateRulesText();
            drawCard();
        }

        function toggleModal(show) {
            document.getElementById('rulesModal').style.display = show ? 'flex' : 'none';
        }

        function updateRulesText() {
            let t = rulesText[currentLang] || rulesText['hinglish'];
            document.getElementById('modalTitle').innerText = t.title;
            document.getElementById('ruleInPerson').innerText = t.inPerson;
            document.getElementById('ruleLongDistance').innerText = t.longDist;
            document.getElementById('ruleGeneral').innerText = t.gen;
        }

        function filterLevel(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            let btnIcon = document.getElementById('btnIcon');
            if(category === 'All') { currentLevelClass = 'lvl-all'; btnIcon.innerText = '❤️'; }
            else if(category === 'Level 1') { currentLevelClass = 'lvl-1'; btnIcon.innerText = '👏'; }
            else if(category === 'Level 2') { currentLevelClass = 'lvl-2'; btnIcon.innerText = '💖'; }
            else if(category === 'Level 3') { currentLevelClass = 'lvl-3'; btnIcon.innerText = '💋'; }
            else if(category === 'Level 4') { currentLevelClass = 'lvl-4'; btnIcon.innerText = '🔥'; }

            document.body.className = currentLevelClass;
            document.getElementById('drawBtn').className = 'draw-btn ' + currentLevelClass;
            updateFloatingIcons(currentLevelClass);
            drawCard();
        }

        function drawCardWithEffect() {
            // Safe Vibration Catch
            try {
                if ("vibrate" in navigator) navigator.vibrate(50);
            } catch(e){}

            playPopSound();

            let overlay = document.getElementById('kissOverlay');
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 450);

            let cardBox = document.getElementById("cardBox");
            cardBox.classList.add("flipping");

            setTimeout(() => {
                drawCard();
                cardBox.classList.remove("flipping");
            }, 300);
        }

        function drawCard() {
            try {
                let filtered = currentCategory === "All" ? cards : cards.filter(c => c.cat === currentCategory);
                if (!filtered.length) return;

                let randomIndex = Math.floor(Math.random() * filtered.length);
                let randomCard = filtered[randomIndex];

                let cardBox = document.getElementById("cardBox");
                let cardText = document.getElementById("cardText");
                let cardTag = document.getElementById("cardTag");
                let cardCounter = document.getElementById("cardCounter");

                let specificClass = currentLevelClass;
                if(currentLevelClass === 'lvl-all') {
                    if(randomCard.cat === 'Level 1') specificClass = 'lvl-1';
                    else if(randomCard.cat === 'Level 2') specificClass = 'lvl-2';
                    else if(randomCard.cat === 'Level 3') specificClass = 'lvl-3';
                    else if(randomCard.cat === 'Level 4') specificClass = 'lvl-4';
                }

                cardBox.className = 'card ' + specificClass;
                
                // Safe Fallback for Language
                cardText.innerText = randomCard[currentLang] || randomCard['hinglish'] || randomCard['english'] || "No question available";
                cardTag.innerText = randomCard.label || randomCard.cat;
                cardCounter.innerText = `Card ${randomIndex + 1} of ${filtered.length}`;
            } catch(e) {
                console.error("Card draw error:", e);
            }
        }

        updateRulesText();
    </script>
</body>
</html>
